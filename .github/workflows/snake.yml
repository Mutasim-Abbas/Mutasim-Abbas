name: Generate contribution snake

# The snake image in README.md is generated here and pushed to the `output` branch.
# It does not exist until this workflow has run at least once — trigger it manually
# from the Actions tab the first time (Run workflow), or just wait for the schedule.

on:
  schedule:
    # Twice a day. The contribution grid does not change faster than that.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push them to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
